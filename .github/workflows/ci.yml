name: CI

# Pull requests check license rules and typecheck, test and build the packages they
# affect. Pushes to main, which carry each sync from the maintainers' repository,
# gate on licenses, types and builds.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history lets Nx compare the pull request with its base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check && pnpm publish:closure:check
      - run: pnpm exec nx affected -t typecheck test build --base=origin/${{ github.base_ref }} --head=HEAD

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Licenses, types and builds gate main; tests report but do not block, since shared
      # runners make a few timing-sensitive tests flaky. `pnpm release` re-checks before publishing.
      - run: pnpm licenses:check && pnpm publish:closure:check && pnpm typecheck && pnpm build
      - run: pnpm test
        continue-on-error: true
